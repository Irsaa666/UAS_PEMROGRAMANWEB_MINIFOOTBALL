<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login to Mini Football Manager - Manage your virtual football club." />
  <title>Login - Mini Football Manager</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo"><i class="bi bi-shield-fill"></i></div>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Sign in to manage your football club</p>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show mb-3" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Login Form -->
    <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text" style="border-radius:8px 0 0 8px;background:#f5f8f6;border:1.5px solid #d4e4dc;border-right:none;">
            <i class="bi bi-envelope" style="color:#7a9e8a;"></i>
          </span>
          <input type="email" class="form-control" id="email" name="email"
                 placeholder="you@example.com" required autocomplete="email"
                 style="border-left:none;border-radius:0 8px 8px 0;" />
        </div>
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text" style="border-radius:8px 0 0 8px;background:#f5f8f6;border:1.5px solid #d4e4dc;border-right:none;">
            <i class="bi bi-lock" style="color:#7a9e8a;"></i>
          </span>
          <input type="password" class="form-control" id="loginPassword" name="password"
                 placeholder="Your password" required autocomplete="current-password"
                 style="border-left:none;border-radius:0 8px 8px 0 ;" />
          <button class="btn btn-outline-secondary" type="button" id="togglePass"
                  style="border-radius:0 8px 8px 0;border:1.5px solid #d4e4dc;border-left:none;"
                  onclick="const f=document.getElementById('loginPassword');f.type=f.type==='password'?'text':'password'">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" style="font-size:0.95rem;">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <div class="auth-divider"><span>Don't have an account?</span></div>

    <div class="auth-footer-link">
      <a href="{{ url_for('auth.register') }}" class="btn btn-outline-secondary w-100 py-2">
        <i class="bi bi-person-plus me-2"></i>Create New Account
      </a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
